name: Build F54 GKI Modules
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GKI 5.15 Prebuilts & Clang
        run: |
          H="https://$://googlesource.com"
          mkdir -p gki && cd gki
          git clone --depth=1 "$H/kernel/prebuilts/5.15/arm64" -b android13-5.15-2024-03 prebuilts
          git clone --depth=1 "$H/platform/prebuilts/clang/host/linux-x86" -b master-kernel-build-2022 clang-repo
      - name: Build KO Modules
        run: |
          export PATH="$PWD/gki/clang-repo/clang-r450784d/bin:$PATH"
          KDIR=$(find $PWD/gki/prebuilts -name "Module.symvers" -exec dirname {} \; | head -n1)
          printf "obj-m += unreal_silk_sched.o\nobj-m += touch_ram_turbo.o\n" > Makefile
          make -C "$KDIR" M="$PWD" ARCH=arm64 LLVM=1 LLVM_IAS=1 LOCALVERSION="-android13-3-34427544" modules
          mkdir -p out && cp *.ko out/
      - uses: actions/upload-artifact@v4
        with:
          name: f54-magic-ko
          path: out/*.ko
